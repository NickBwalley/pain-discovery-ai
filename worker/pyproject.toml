[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pain-discovery-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pain-discovery = "pain_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pain_discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
